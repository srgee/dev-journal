[project]
name = "dev-journal"
version = "1.1.0"
description = "A command-line developer journal and logging utility built with Python and Typer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.3,<0.28.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0,<5.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.17.1,<0.18.0",
]

[project.scripts]
journal = "journal.cli:app"

[build-system]
requires = ["uv_build>=0.12.22,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "P20D"

[tool.uv.build-backend]
module-name = "journal"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = []

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "*/__init__.py",
    "*/__main__.py",
]
