[project]
name = "dev-journal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pre-commit>=4.7.0,<5.0.0",
    "typer>=0.27.3,<0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.17.1,<0.18.0",
]

[project.scripts]
journal = "journal.cli:app"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "journal"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
