name: CI Quality & Security Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

# Cancel in-progress runs on the same branch to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # -------------------------------------------------------------
  # JOB 1: Static Analysis, Formatting & Security (Fast-Fail)
  # -------------------------------------------------------------
  lint-and-sec:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Check for Hardcoded Secrets
        uses: trufflesecurity/trufflehog-action@main
        with:
          extra_args: --results=verified,unknown

      - name: Check Code Style & Formatting (Ruff)
        run: uvx ruff check . && uvx ruff format --check .

      - name: Security Audit on Application Code (Bandit)
        run: uvx bandit -r . -s B101 -x tests,.venv,venv -ll -q

      - name: Dependency Security Audit (Pip-audit)
        run: uvx pip-audit --strict

  # -------------------------------------------------------------
  # JOB 2: Test Suite & Build Verification
  # -------------------------------------------------------------
  test-and-build:
    name: Test Suite & Coverage
    needs: lint-and-sec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Execute Tests with Coverage Gate
        run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=80

  # -------------------------------------------------------------
  # JOB 3: Squash & Merge Linting (Pull Requests only)
  # -------------------------------------------------------------
  pr-title-check:
    name: Validate Conventional Commit Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR Title aligns with Conventional Commits
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6  #v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            chore
            docs
            test