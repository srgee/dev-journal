name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Create Release
        uses: softprops/action-gh-release@v28a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          generate_release_notes: true